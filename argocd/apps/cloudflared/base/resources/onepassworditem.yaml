apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflared
  annotations:
    # Restart the deployment automatically if the tunnel token rotates in 1Password.
    operator.1password.io/auto-restart: "true"
spec:
  # 1Password item `cloudflare-tunnel` has field `token` = the tunnel token from
  # Cloudflare Zero Trust → Networks → Tunnels → homelab → install/"run" command.
  itemPath: "vaults/homelab/items/cloudflare-tunnel"

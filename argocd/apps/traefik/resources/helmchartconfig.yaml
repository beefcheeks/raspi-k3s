# Overlays config onto the k3s-bundled Traefik (v3) instead of shipping our own chart.
# k3s's helm-controller merges valuesContent into the bundled Traefik HelmChart.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Required so ingress ip-allow-list middleware sees real client source IPs
    service:
      spec:
        externalTrafficPolicy: Local
    # 2 replicas so one not-ready pod doesn't knock out the LB IP
    deployment:
      replicas: 2
